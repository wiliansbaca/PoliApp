<nav class="navbar navbar-expand-md navbar-dark navbar-poli">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-bold" routerLink="/"><i class="bi bi-dribbble me-1"></i>Poli-App</a>
    <button class="navbar-toggler" type="button" (click)="menu.classList.toggle('show')" aria-label="Menú">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div #menu class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" routerLink="/canchas" routerLinkActive="active">Canchas</a></li>
        @if (auth.autenticado()) {
          <li class="nav-item"><a class="nav-link" routerLink="/mis-reservas" routerLinkActive="active">Mis reservas</a></li>
        }
        @if (auth.esAdmin()) {
          <li class="nav-item"><a class="nav-link" routerLink="/admin" routerLinkActive="active">Administración</a></li>
        }
      </ul>
      @if (auth.sesion(); as s) {
        <span class="badge rounded-pill text-bg-light me-2 py-2 px-3">
          <i class="bi bi-person-circle me-1"></i>{{ s.rol === 'Administrador' ? 'Admin: ' : '' }}{{ s.nombre }}
        </span>
        <button class="btn btn-sm btn-outline-light" (click)="auth.salir()">Salir</button>
      } @else {
        <a class="btn btn-sm btn-light" routerLink="/login">Ingresar</a>
      }
    </div>
  </div>
</nav>

<router-outlet />
